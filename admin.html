<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>دخول المشرف</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#1a2b43,#080b12 65%);color:#fff;font-family:Tahoma,Arial}main{width:min(100%,560px)}h1,h2{color:#e6c783}.box{background:linear-gradient(145deg,#17263a,#0b1320);border:1px solid #b99a5b88;border-radius:18px;padding:25px;margin:14px 0;box-shadow:0 20px 60px #0008}label{display:block;margin-top:16px;color:#e8d5a8}input{padding:14px;border-radius:10px;border:1px solid #68758a;background:#080f1b;color:#fff;width:100%;margin:8px 0 2px;direction:ltr;text-align:left}button{padding:13px 22px;background:linear-gradient(135deg,#e5cb91,#a98242);border:0;border-radius:9px;font-weight:bold;cursor:pointer;margin-top:18px;width:100%}.muted{color:#aeb8c6;line-height:1.8}#status{color:#e6c783;min-height:24px}.hidden{display:none!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:12px;border-bottom:1px solid #ffffff22;text-align:right}th{color:#e6c783}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
</style></head><body><main><div class="topline"><h1>TAIF TRIP</h1><span class="muted">مشرف الموقع</span></div>
<section class="box" id="loginBox"><h2>دخول المشرف</h2><label for="password">كلمة المرور السرية</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"><label for="verification">رمز التحقق السري</label><input id="verification" type="password" autocomplete="one-time-code" placeholder="رمز التحقق"><button id="login">دخول</button><p id="status" role="status"></p></section>
<section class="box hidden" id="dashboard"><div class="topline"><h2>لوحة المشرف</h2><button id="logout" style="width:auto;margin:0">تسجيل الخروج</button></div><p class="muted">بيانات التسجيلات خاصة بالمشرف.</p><div class="tablewrap"><table><thead><tr><th>الصفة</th><th>الاسم</th><th>الكنية</th><th>رقم الجوال</th><th>وقت التسجيل</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id);
async function load(){const r=await fetch('/api/admin/participants',{credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'انتهت الجلسة.');$('rows').innerHTML='';if(!d.participants.length){$('rows').innerHTML='<tr><td colspan="5">لا توجد تسجيلات حتى الآن.</td></tr>';return}for(const p of d.participants){const tr=document.createElement('tr');[p.role==='teacher'?'معلم':'طالب',p.name,p.kunya,p.phone,new Date(p.created_at+'Z').toLocaleString('ar-SA')].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').appendChild(tr)}}
$('login').addEventListener('click',async()=>{$('login').disabled=true;$('status').textContent='جارٍ التحقق…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:$('password').value,verificationCode:$('verification').value})}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'تعذر تسجيل الدخول');await load();$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden')}catch(e){$('status').textContent=e.message;$('password').value='';$('verification').value=''}finally{$('login').disabled=false}});
$('logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});$('dashboard').classList.add('hidden');$('loginBox').classList.remove('hidden');$('status').textContent='تم تسجيل الخروج.'});
</script></body></html>
