<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>حضور رحلة الطائف - المعلم</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(ellipse at top,#243a54,#080b12 70%);color:#fff;font-family:Tahoma,Arial}main{max-width:900px;margin:auto}.box{background:linear-gradient(145deg,#17263a,#0b1320);border:1px solid #b99a5b88;border-radius:18px;padding:20px;margin:14px 0}h1,h2{color:#e6c783}.muted{color:#aeb8c6;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{padding:16px;background:#0b1421;border:1px solid #ffffff20;border-radius:12px}.num{font-size:27px;color:#f2d99e;font-weight:bold}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:12px;border-bottom:1px solid #ffffff22;text-align:right}th{color:#e6c783}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#263b50;color:#f3dfb4}a{color:#f1d69b}#status{color:#e6c783}</style></head><body><main><div class="box"><h1>TAIF TRIP</h1><h2>متابعة تأكيد حضور الطلاب والمعلمين</h2><p class="muted">هذه الصفحة مخصصة لحسابات المعلمين المسجلة. تعرض أسماء المشاركين وحالة تأكيد حضورهم فقط.</p><p id="status">جارٍ التحقق من حساب المعلم…</p><div class="stats" id="stats"></div></div><section class="box"><div class="tablewrap"><table><thead><tr><th>المشارك</th><th>الصفة</th><th>حالة الحضور</th><th>آخر تحديث</th></tr></thead><tbody id="rows"></tbody></table></div></section><p><a href="/">العودة إلى موقع الرحلة</a></p></main><script>function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function date(v){return v?new Date(String(v).replace(" ","T")+"Z").toLocaleString("ar-SA"):"—"}async function load(){try{const r=await fetch("/api/teacher-attendance",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"تعذر التحقق");document.getElementById("status").textContent="تم التحقق من حساب المعلم.";document.getElementById("stats").innerHTML=[["سيحضر",d.stats.yes],["لن يحضر",d.stats.no],["لم يحدد",d.stats.pending]].map(x=>'<div class="stat"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join("");document.getElementById("rows").innerHTML=d.attendance.map(p=>'<tr><td>'+esc(p.kunya)+' — '+esc(p.name)+'</td><td><span class="pill">'+(p.role==="teacher"?"معلم":"طالب")+'</span></td><td>'+(p.attendance==="yes"?"✅ قادم":p.attendance==="no"?"❌ غير قادم":"⏳ لم يحدد")+'</td><td>'+date(p.updated_at)+'</td></tr>').join("")||'<tr><td colspan="4">لا توجد حسابات مسجلة.</td></tr>';}catch(e){document.getElementById("status").textContent=e.message+" — سجّل الدخول من صفحة الموقع بحساب المعلم، ثم افتح هذه الصفحة."}}load();</script></body></html>
